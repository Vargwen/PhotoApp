<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo App - AWS Project</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Authentication Section */
        .auth-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .auth-section.hidden {
            display: none;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        /* App Section */
        .app-section {
            display: none;
        }

        .app-section.active {
            display: block;
        }

        .user-info {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .user-info span {
            font-weight: 600;
            color: #667eea;
        }

        /* Upload Section */
        .upload-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-area:hover {
            background: #f8f9ff;
            border-color: #5568d3;
        }

        .upload-area.dragover {
            background: #f0f4ff;
            border-color: #667eea;
        }

        #fileInput {
            display: none;
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        /* Gallery */
        .gallery-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .gallery-section h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .photo-card {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            cursor: pointer;
        }

        .photo-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        .photo-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .photo-card .actions {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            padding: 10px;
            transform: translateY(100%);
            transition: transform 0.3s;
        }

        .photo-card:hover .actions {
            transform: translateY(0);
        }

        .photo-card .actions button {
            padding: 5px 10px;
            font-size: 0.9rem;
        }

        /* Loading & Messages */
        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-size: 1.2rem;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* Modal for full image */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 2rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 Photo App</h1>
            <p>AWS Serverless Project - SAA Certification Practice</p>
        </div>

        <!-- Message Area -->
        <div id="messageArea"></div>

        <!-- Authentication Section -->
        <div id="authSection" class="auth-section">
            <!-- Login Form -->
            <div id="loginForm">
                <h2 style="margin-bottom: 20px;">Connexion</h2>
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" placeholder="votreemail@example.com">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Mot de passe</label>
                    <input type="password" id="loginPassword" placeholder="••••••••">
                </div>
                <button class="btn" onclick="login()">Se connecter</button>
                <p style="margin-top: 15px; text-align: center;">
                    <a href="#" onclick="showSignupForm(); return false;" style="color: #667eea;">Pas encore de compte ? S'inscrire</a>
                </p>
            </div>

            <!-- Signup Form (hidden initially) -->
            <div id="signupForm" style="display: none;">
                <h2 style="margin-bottom: 20px;">Inscription</h2>
                <div class="form-group">
                    <label for="signupName">Nom</label>
                    <input type="text" id="signupName" placeholder="Votre nom">
                </div>
                <div class="form-group">
                    <label for="signupEmail">Email</label>
                    <input type="email" id="signupEmail" placeholder="votreemail@example.com">
                </div>
                <div class="form-group">
                    <label for="signupPassword">Mot de passe</label>
                    <input type="password" id="signupPassword" placeholder="Min 8 caractères">
                </div>
                <div class="form-group">
                    <label for="signupPasswordConfirm">Confirmer le mot de passe</label>
                    <input type="password" id="signupPasswordConfirm" placeholder="Retapez votre mot de passe">
                </div>
                <button class="btn" onclick="signup()">S'inscrire</button>
                <p style="margin-top: 15px; text-align: center;">
                    <a href="#" onclick="showLoginForm(); return false;" style="color: #667eea;">Déjà un compte ? Se connecter</a>
                </p>
            </div>
        </div>

        <!-- App Section (hidden until logged in) -->
        <div id="appSection" class="app-section">
            <!-- User Info -->
            <div class="user-info">
                <span id="userEmail"></span>
                <button class="btn btn-secondary" onclick="logout()">Déconnexion</button>
            </div>

            <!-- Upload Section -->
            <div class="upload-section">
                <h2 style="margin-bottom: 20px;">Uploader une photo</h2>
                <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                    <div class="upload-icon">📁</div>
                    <p><strong>Cliquez pour sélectionner</strong> ou glissez-déposez une image</p>
                    <p style="color: #666; font-size: 0.9rem; margin-top: 10px;">JPG, PNG - Max 5MB</p>
                </div>
                <input type="file" id="fileInput" accept="image/jpeg,image/png,image/jpg" onchange="handleFileSelect(event)">
                <div id="uploadProgress" style="margin-top: 20px;"></div>
            </div>

            <!-- Gallery Section -->
            <div class="gallery-section">
                <h2>Mes photos <span id="photoCount" style="color: #667eea;"></span></h2>
                <div id="galleryGrid" class="gallery-grid"></div>
            </div>
        </div>
    </div>

    <!-- Modal for full image view -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="modal-close">×</span>
        <img id="modalImage" src="" alt="Photo">
    </div>

    <script>
        // ⚠️ CONFIGURATION - À MODIFIER AVEC VOS VALEURS
        const CONFIG = {
            region: 'eu-west-3',
            userPoolId: 'eu-west-3_yRaGQSRLa',  
            clientId: '42qbmhjscn3pbif24os0r855v2',   
            apiUrl: 'https://xgn18hcsw8.execute-api.eu-west-3.amazonaws.com/dev',
            bucketName: 'photoapp-images-nico-010126'  
        };

        // State
        let currentUser = null;
        let idToken = null;

        // Check if already logged in
        window.onload = function() {
            const storedToken = localStorage.getItem('idToken');
            const storedEmail = localStorage.getItem('userEmail');
            
            if (storedToken && storedEmail) {
                idToken = storedToken;
                currentUser = { email: storedEmail };
                showApp();
                loadPhotos();
            }
        };

        // Toggle between login and signup forms
        function showSignupForm() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('signupForm').style.display = 'block';
        }

        function showLoginForm() {
            document.getElementById('signupForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
        }

        // Signup
        async function signup() {
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const passwordConfirm = document.getElementById('signupPasswordConfirm').value;

            if (!name || !email || !password) {
                showMessage('Veuillez remplir tous les champs', 'error');
                return;
            }

            if (password !== passwordConfirm) {
                showMessage('Les mots de passe ne correspondent pas', 'error');
                return;
            }

            if (password.length < 8) {
                showMessage('Le mot de passe doit contenir au moins 8 caractères', 'error');
                return;
            }

            try {
                showMessage('Création du compte...', 'success');
                
                // ⚠️ TODO: Implémenter vraie inscription Cognito
                // Pour le TP en mode dev, on simule
                showMessage('✅ Compte créé! Vérifiez votre email pour confirmer votre compte.', 'success');
                
                setTimeout(() => {
                    showLoginForm();
                }, 3000);
                
            } catch (error) {
                showMessage('Erreur lors de l\'inscription: ' + error.message, 'error');
            }
        }

        // Login (simplified - using direct credentials)
        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showMessage('Veuillez remplir tous les champs', 'error');
                return;
            }

            try {
                // ⚠️ SIMPLIFIED LOGIN - En production, utilisez AWS Amplify ou SDK Cognito
                // Pour ce TP, on va simuler avec un token temporaire
                
                showMessage('Connexion...', 'success');
                
                // TODO: Implémenter vraie auth Cognito
                // Pour l'instant, mode "développement" avec token fictif
                idToken = 'dev-token-' + Date.now();
                currentUser = { email: email };
                
                localStorage.setItem('idToken', idToken);
                localStorage.setItem('userEmail', email);
                
                showApp();
                loadPhotos();
                
            } catch (error) {
                showMessage('Erreur de connexion: ' + error.message, 'error');
            }
        }

        // Logout
        function logout() {
            localStorage.removeItem('idToken');
            localStorage.removeItem('userEmail');
            idToken = null;
            currentUser = null;
            
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('appSection').classList.remove('active');
        }

        // Show app after login
        function showApp() {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('appSection').classList.add('active');
            document.getElementById('userEmail').textContent = currentUser.email;
        }

        // File selection handling
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                uploadPhoto(file);
            }
        }

        // Drag and drop
        const uploadArea = document.getElementById('uploadArea');
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                uploadPhoto(file);
            }
        });

        // Upload photo
        async function uploadPhoto(file) {
            const progressDiv = document.getElementById('uploadProgress');
            progressDiv.innerHTML = '<div class="loading">⏳ Upload en cours...</div>';

            try {
                // Step 1: Request presigned URL
                const response = await fetch(`${CONFIG.apiUrl}/photos/upload`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${idToken}`
                    },
                    body: JSON.stringify({
                        fileName: file.name,
                        fileSize: file.size,
                        contentType: file.type
                    })
                });

                if (!response.ok) {
                    throw new Error('Erreur lors de la génération de l\'URL');
                }

                const data = await response.json();
                const uploadUrl = data.uploadUrl;

                // Step 2: Upload directly to S3
                const uploadResponse = await fetch(uploadUrl, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': file.type
                    },
                    body: file
                });

                if (!uploadResponse.ok) {
                    throw new Error('Erreur lors de l\'upload S3');
                }

                progressDiv.innerHTML = '';
                showMessage('✅ Photo uploadée avec succès! Le thumbnail sera généré dans quelques secondes.', 'success');
                
                // Reload gallery after a few seconds (time for resize)
                setTimeout(() => {
                    loadPhotos();
                }, 3000);

            } catch (error) {
                progressDiv.innerHTML = '';
                showMessage('❌ Erreur: ' + error.message, 'error');
            }
        }

        // Load photos from API
        async function loadPhotos() {
            const galleryGrid = document.getElementById('galleryGrid');
            galleryGrid.innerHTML = '<div class="loading">Chargement des photos...</div>';

            try {
                const response = await fetch(`${CONFIG.apiUrl}/photos`, {
                    headers: {
                        'Authorization': `Bearer ${idToken}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Erreur lors du chargement');
                }

                const data = await response.json();
                const photos = data.photos || [];

                document.getElementById('photoCount').textContent = `(${photos.length})`;

                if (photos.length === 0) {
                    galleryGrid.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📷</div>
                            <p>Aucune photo pour le moment</p>
                            <p style="color: #999; font-size: 0.9rem;">Uploadez votre première photo ci-dessus!</p>
                        </div>
                    `;
                    return;
                }

                // Display photos
                galleryGrid.innerHTML = photos.map(photo => {
                    const thumbnailUrl = `https://${CONFIG.bucketName}.s3.${CONFIG.region}.amazonaws.com/${photo.thumbnailKey || photo.originalKey}`;
                    const originalUrl = `https://${CONFIG.bucketName}.s3.${CONFIG.region}.amazonaws.com/${photo.originalKey}`;
                    
                    return `
                        <div class="photo-card">
                            <img src="${thumbnailUrl}" alt="${photo.fileName}" onclick="openModal('${originalUrl}')">
                            <div class="actions">
                                <button class="btn btn-danger" onclick="deletePhoto('${photo.photoId}', event)">🗑️ Supprimer</button>
                            </div>
                            <div style="padding: 10px; font-size: 0.8rem; color: #666;">
                                ${photo.fileName}
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                galleryGrid.innerHTML = `<div class="message error">Erreur: ${error.message}</div>`;
            }
        }

        // Delete photo
        async function deletePhoto(photoId, event) {
            event.stopPropagation();
            
            if (!confirm('Voulez-vous vraiment supprimer cette photo ?')) {
                return;
            }

            try {
                const response = await fetch(`${CONFIG.apiUrl}/photos/${photoId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${idToken}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Erreur lors de la suppression');
                }

                showMessage('Photo supprimée avec succès', 'success');
                loadPhotos();

            } catch (error) {
                showMessage('Erreur: ' + error.message, 'error');
            }
        }

        // Modal functions
        function openModal(imageUrl) {
            document.getElementById('modalImage').src = imageUrl;
            document.getElementById('imageModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('imageModal').classList.remove('active');
        }

        // Show message
        function showMessage(text, type) {
            const messageArea = document.getElementById('messageArea');
            messageArea.innerHTML = `<div class="message ${type}">${text}</div>`;
            
            setTimeout(() => {
                messageArea.innerHTML = '';
            }, 5000);
        }
    </script>
</body>
</html>
